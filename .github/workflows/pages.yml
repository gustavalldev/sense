name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Serve social images from the Pages deployment
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          find public -name '*.html' \
            -exec sed -i "s|https://sensestudio\.ru/assets/share/|${SITE_URL%/}/assets/share/|g" {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
